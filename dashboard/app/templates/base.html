<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} · algotrade</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:,">
</head>
<body{% if settings.is_prod %} class="prod"{% endif %}>

{% if settings.is_prod %}
<div class="env-banner">LIVE — real money</div>
{% endif %}

<nav class="nav">
  <a class="brand" href="/">algotrade</a>
  <div class="links">
    <a href="/" {% if title == 'Summary' %}class="on"{% endif %}>Summary</a>
    <a href="/holdings" {% if title == 'Holdings' %}class="on"{% endif %}>Holdings</a>
    <a href="/recommendations" {% if title.startswith('Recommend') or title.startswith('Record') %}class="on"{% endif %}>Trades</a>
    <a href="/health" {% if title == 'Health' %}class="on"{% endif %}>Health</a>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <span>{{ settings.portfolio_id }}</span>
  <span>{{ settings.mongodb_database }}</span>
  {% if not settings.allow_writes %}<span>read-only</span>{% endif %}
</footer>

</body>
</html>
