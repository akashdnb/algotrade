# Monthly rebalance -- checked DAILY, executed at most once per period.
#
# A once-a-month cron is the wrong shape here. It fires on a calendar day that
# may not be a trading day, and if that single firing is dropped (which GitHub
# documents as possible) the month is silently missed with no second chance.
#
# So the CHECK runs every weekday and exits in seconds unless:
#   - the period's last trading session has passed, AND
#   - no completed rebalance_run exists for that period.
# Cost is ~20 seconds a day. In exchange, a missed rebalance is picked up
# within 24 hours with no human involved.
#
# "The period" is the latest CLOSED month -- one with a session in a later
# month -- never the month in progress, which can never be complete. Deriving
# it from the latest session instead made this answer "not due" every day of
# the year; see claude_fixes/2026-09-02-monthly-rebalance-never-fires.md.
#
# A month missed entirely is NOT gone back for. The run catches up to the
# latest closed month and names the skipped ones, because filing a November
# run under 2026-09 and marking it completed would erase the gap and claim a
# rebalance that never happened.
#
# Exactly-once is enforced by the database, not by this file: rebalance_runs
# uses `portfolio:period` as its _id, so two concurrent runs cannot both claim
# a period regardless of timing (design §11.5).

name: Rebalance

on:
  schedule:
    - cron: '0 15 * * 1-5'      # 20:30 IST, after daily
  workflow_dispatch:
    inputs:
      portfolio_id:
        description: 'Portfolio (blank = every active one)'
        required: false
        type: string
      period:
        description: 'YYYY-MM (blank = current)'
        required: false
        type: string
      force:
        description: 'Regenerate even if a run is already completed (new revision)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rebalance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: paper
    outputs:
      due: ${{ steps.due.outputs.due }}
      portfolios: ${{ steps.due.outputs.portfolios }}
      period: ${{ steps.due.outputs.period }}
    env:
      ENVIRONMENT: paper
      MONGODB_URI:      ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      DEFAULT_PORTFOLIO_ID: ${{ vars.DEFAULT_PORTFOLIO_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate configuration
        run: python -m algotrade.check_config --no-network

      # Reads STATE to decide, never "the cron fired".
      - name: Is a rebalance due?
        id: due
        run: |
          python -m jobs.generate_recommendations --check-only \
            ${{ inputs.portfolio_id && format('--portfolio-id {0}', inputs.portfolio_id) || '' }} \
            ${{ inputs.period && format('--period {0}', inputs.period) || '' }} \
            ${{ inputs.force && '--force' || '' }}

  rebalance:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: paper
    strategy:
      fail-fast: false          # one portfolio failing must not skip the others
      max-parallel: 1           # serialise writes; the book is small
      matrix:
        portfolio_id: ${{ fromJSON(needs.check.outputs.portfolios) }}
    env:
      ENVIRONMENT: paper
      LOG_LEVEL: INFO
      MONGODB_URI:      ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/archive
          key: market-archive-v1
      - uses: actions/cache@v4
        with:
          path: data/curated
          key: curated-${{ hashFiles('data/sessions/**/*.csv') }}
          restore-keys: curated-

      # This job does NOT rebuild the panel -- it reads the curated store -- so
      # its exposure is a `curated-` cache miss rather than a missing archive.
      # A short panel here would not fail: it would recommend a month's trades
      # from a truncated history and look entirely normal doing it. The daily
      # job asserts on the archive; this one has to assert on the panel itself.
      - name: Assert the curated panel covers its full history
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date
          try:
              m = json.load(open("data/curated/manifest.json"))
          except FileNotFoundError:
              sys.exit("::error::No curated panel. The `curated-` cache missed "
                       "and this job does not rebuild one.")
          first = date.fromisoformat(m["first_session"])
          print(f"panel: {m['sessions']:,} sessions, "
                f"{m['first_session']} .. {m['last_session']}")
          if first > date(2011, 1, 1):
              sys.exit(f"::error::PANEL TRUNCATED: starts {first}. Momentum was "
                       f"validated on 2010-2026; ranking on a shorter history "
                       f"is a different strategy. See "
                       f"claude_fixes/2026-09-04-archive-release-missing.md")
          PY

      # Refuses if the strategy file's hash differs from the one the portfolio
      # was created with. A frozen strategy that can be edited without anyone
      # noticing is not frozen (§1.3, §9.2).
      - name: Verify frozen strategy
        run: python -m jobs.generate_recommendations --verify-frozen
             --portfolio-id "${{ matrix.portfolio_id }}"

      - name: Generate recommendations
        id: generate
        run: |
          python -m jobs.generate_recommendations \
            --portfolio-id "${{ matrix.portfolio_id }}" \
            ${{ inputs.period && format('--period {0}', inputs.period) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # A shadow portfolio is the control group: it follows every instruction
      # exactly, at the reference price, with nobody deciding anything. That
      # obedience IS the measurement -- `paper - shadow` is what discretion and
      # slippage cost -- so it fills here and now, against the prices the
      # recommendation was computed from. Filling it on the next daily run
      # instead would add a day of market drift that is not discretion, and
      # then count it as though it were.
      - name: Auto-fill shadow at reference price
        if: steps.generate.outputs.set_id != '' && startsWith(matrix.portfolio_id, 'shadow_')
        run: |
          python -m jobs.record_execution \
            --set-id "${{ steps.generate.outputs.set_id }}" --auto-fill
          python -m jobs.value_portfolio \
            --portfolio-id "${{ matrix.portfolio_id }}" --rebuild-holdings

      # The alert IS the deliverable here: a recommendation nobody sees is a
      # recommendation nobody acts on. No orders are placed.
      #
      # Not for a shadow, which has already filled itself above. An alert
      # asking you to act on a book you must never touch is noise, and noise
      # trains you to ignore the alerts that do need you.
      - name: Send rebalance alert
        if: steps.generate.outputs.set_id != '' && !startsWith(matrix.portfolio_id, 'shadow_')
        run: python -m jobs.rebalance_alert --set-id "${{ steps.generate.outputs.set_id }}"

      - name: Notify failure
        if: failure()
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          from algotrade.platform.telegram import TelegramClient, escape
          token, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if token and chat:
              TelegramClient(token, chat).send("\n".join([
                  "\U0001F534 *Rebalance failed* · " + escape("${{ matrix.portfolio_id }}"),
                  "", escape("https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"),
                  "", escape("Does NOT self-heal silently: the check runs again tomorrow, "
                             "but investigate before the period's data goes stale."),
              ]))
          PY
