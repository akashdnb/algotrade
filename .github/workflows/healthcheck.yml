# Watchdog: detect the failures the other workflows cannot report.
#
# A workflow that fails can alert. A workflow that never STARTS cannot -- and
# that is the more likely failure over a multi-year horizon (a dropped
# schedule, a disabled repo, a deleted workflow). This job independently
# queries state and alerts on what it finds missing.
#
# It also runs on Saturday, when nothing else does, so a repository that has
# been quiet all week still registers activity against GitHub's 60-day
# scheduled-workflow disable.
#
# NOTE: this cannot detect its OWN failure. That is what healthchecks.io is
# for, and why HEALTHCHECKS_PING_URL is a required secret in paper and prod.

name: Healthcheck

on:
  schedule:
    - cron: '0 4 * * *'        # 09:30 IST daily, before market open
  workflow_dispatch:
    inputs:
      quiet:
        description: 'Report only; send no Telegram message'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: healthcheck
  cancel-in-progress: true     # a superseded check has no value

defaults:
  run:
    shell: bash

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: paper
    env:
      ENVIRONMENT: paper
      LOG_LEVEL: INFO
      MONGODB_URI:      ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      DEFAULT_PORTFOLIO_ID: ${{ vars.DEFAULT_PORTFOLIO_ID }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt

      # Connectivity, schema drift, storage headroom, data freshness.
      # --skip-healthchecks-ping: this workflow is not the heartbeat's owner
      # (daily.yml is). Pinging /start here with nothing to close the loop
      # made the shared check flap down every morning for no real reason.
      # Each check tees to one log so the alert below can quote what actually
      # failed. pipefail (set in `defaults`) keeps the step's exit status.
      - name: Configuration and connectivity
        id: config
        run: |
          python -m algotrade.check_config --skip-healthchecks-ping \
            2>&1 | tee -a "$RUNNER_TEMP/watchdog.log"

      - name: Report gaps
        id: gaps
        run: python -m jobs.ingest_session --check 2>&1 | tee -a "$RUNNER_TEMP/watchdog.log"

      # Every threshold in design §10.1: stale data, failed jobs, missing
      # rebalance, unexecuted recommendations, notification failures, storage.
      - name: Watchdog checks
        id: checks
        run: |
          python -m jobs.watchdog \
            ${{ inputs.quiet && '--quiet' || '--alert' }} \
            2>&1 | tee -a "$RUNNER_TEMP/watchdog.log"

      # A check that FINDS something is the watchdog working, not the watchdog
      # broken, and the two need different messages. Reporting every failure as
      # "the monitor is down -- check Atlas connectivity and secrets" sent three
      # mornings of alerts naming the two things that were fine (Atlas answered
      # in 726 ms, both secrets authenticated) and never naming the one that was
      # wrong: three collections were missing their indexes and validators.
      #
      # So: quote the finding. Claim the monitor itself is down only when it
      # produced no finding to quote.
      - name: Alert on watchdog failure
        if: failure()
        continue-on-error: true
        env:
          STEP: >-
            ${{ steps.config.outcome == 'failure' && 'configuration and connectivity'
            || steps.gaps.outcome == 'failure' && 'the session gap report'
            || steps.checks.outcome == 'failure' && 'the watchdog checks'
            || 'setup, before any check ran' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, pathlib
          from algotrade.platform.telegram import TelegramClient, escape
          token, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (token and chat):
              raise SystemExit(0)

          log = pathlib.Path(os.environ["RUNNER_TEMP"], "watchdog.log")
          text = log.read_text(errors="replace") if log.exists() else ""
          # A finding, plus the "-> run: ..." remedy line that follows it --
          # that hint is the most actionable part and carries no marker of
          # its own, so matching markers alone would drop it.
          lines, found = text.splitlines(), []
          for i, line in enumerate(lines):
              if "[FAIL]" not in line and "[CRIT]" not in line:
                  continue
              found.append(line.strip())
              hint = lines[i + 1].strip() if i + 1 < len(lines) else ""
              if hint.startswith("->"):
                  found.append(hint)
          found = found[:8]
          step, url = os.environ["STEP"], os.environ["RUN_URL"]

          if found:
              body = ["\U0001F534 *Watchdog found a problem*", "",
                      escape(f"{step} reported:"), ""]
              body += [escape(f"\u2022 {line}") for line in found]
              body += ["", escape("The monitor is working. This is what it found."),
                       "", escape(url)]
          else:
              body = ["\U0001F534 *Watchdog itself failed*", "",
                      escape(f"{step} failed without reporting a finding, "
                             "so the monitor could not run rather than "
                             "having found something."),
                      "", escape(url)]
          TelegramClient(token, chat).send("\n".join(body))
          PY
