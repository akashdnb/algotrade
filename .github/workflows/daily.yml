# Daily: ingest -> signals -> value -> snapshot -> reconcile -> report.
#
# RECONCILIATION-DRIVEN. No step assumes the previous run happened, or that the
# cron fired on time. Each asks "what is missing?" and fills it, so a dropped,
# delayed, or skipped run self-heals on the next firing -- which GitHub
# documents as a real possibility, not a hypothetical.
#
# Every step is idempotent: ingestion skips sessions already on disk, signals
# and snapshots upsert by natural key, and the Telegram report dedupes by
# (kind, portfolio, date). Re-running this workflow changes nothing.
#
# The commit at the end is load-bearing twice: it is the append-only audit
# trail of market data, AND it keeps the repository active, defeating GitHub's
# 60-day disable of scheduled workflows on inactive repos.

name: Daily

on:
  # BACKUP trigger. GitHub's own scheduler has run this 5-12 hours late and is
  # documented as best-effort; a Vercel cron (precision +/-59 min) fires this
  # at 16:30 UTC, two hours after the 14:30 schedule below, as a safety net.
  # `schedule:` remains PRIMARY -- this is a second chance, not a replacement.
  #
  # A duplicate run is safe and cheap: the concurrency group serialises it and
  # every step is idempotent by natural key, so if the scheduled run already
  # happened this one is a clean no-op.
  repository_dispatch:
    types: [run-daily]

  schedule:
    # 14:30 UTC = 20:00 IST, Mon-Fri. NSE publishes sec_bhavdata_full around
    # 18:00-19:00 IST. GitHub may delay this 5-30 minutes; nothing depends on
    # the exact time.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      through:
        description: 'Last session to process (YYYY-MM-DD). Blank = today IST.'
        required: false
        type: string
      backfill:
        description: 'Sessions to ensure are valued'
        required: false
        default: '5'
        type: string
      skip_report:
        description: 'Run without sending Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false     # never kill a run mid-write

defaults:
  run:
    shell: bash

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: paper
    env:
      ENVIRONMENT: paper
      LOG_LEVEL: INFO
      MONGODB_URI:            ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE:       ${{ secrets.MONGODB_DATABASE }}
      TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL:  ${{ secrets.HEALTHCHECKS_PING_URL }}
      DEFAULT_PORTFOLIO_ID:   ${{ vars.DEFAULT_PORTFOLIO_ID }}
      # `vercel-cron` when the dispatch came from the scheduled Vercel job,
      # `manual` when a human called the endpoint. Recorded on every job_run so
      # "repaired without human intervention" stays a fact the ledger can be
      # queried for rather than an inference from the event name.
      ALGOTRADE_TRIGGER_SOURCE: ${{ github.event.client_payload.source }}
      # Normally unset and therefore empty. Set to `generate_signals` (a repo
      # VARIABLE, so it is readable and deletable, unlike a secret) to make the
      # next scheduled run fail on purpose for the acceptance gate's
      # self-healing criterion. check_config warns loudly while it is armed.
      ALGOTRADE_FAULT_INJECT: ${{ vars.ALGOTRADE_FAULT_INJECT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      # Tell the dead-man switch a run began, so a hung run is distinguishable
      # from one that never started.
      - name: Heartbeat start
        if: env.HEALTHCHECKS_PING_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_PING_URL%/}/start" || true

      # Fail at 20:00 with "MONGODB_URI is not set" rather than at 20:06
      # half-way through a partial write.
      - name: Validate configuration
        run: python -m algotrade.check_config

      # Frozen historical archive. Immutable, so this is a permanent cache hit
      # after the first run.
      - name: Restore market-data archive
        id: archive
        uses: actions/cache@v4
        with:
          path: data/archive
          key: market-archive-v1

      - name: Download archive on cache miss
        if: steps.archive.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/archive
          if gh release download market-archive-v1 --pattern 'archive.tar.zst' --dir /tmp; then
            tar --use-compress-program=unzstd -xf /tmp/archive.tar.zst -C data/archive
            echo "archive restored: $(find data/archive -name '*.csv' | wc -l) sessions"
          else
            echo "::warning::no archive release; relying on committed sessions"
          fi

      # Derived panel: a cache, never a source of truth. restore-keys means
      # yesterday's build seeds today's.
      - name: Restore curated panel
        uses: actions/cache@v4
        with:
          path: data/curated
          key: curated-${{ hashFiles('data/sessions/**/*.csv') }}
          restore-keys: curated-

      # `TZ=Asia/Kolkata date +%F` was wrong here: it yields the wall-clock IST
      # day, so a run delayed past IST midnight (GitHub has delayed these by
      # 9-12 h) claimed a day that had not traded yet -- once a Saturday.
      # clock.session_date is the single definition, shared with the jobs.
      - name: Resolve business date
        id: bd
        run: |
          D="${{ inputs.through }}"
          if [ -z "$D" ]; then
            D=$(python -c 'from algotrade.platform import clock; print(clock.session_date(clock.SystemClock().now()))')
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "Business date (session this run is for): $D"

      # ---- 1. ingest: the GAP is the unit of work, not "today" -------------
      - name: Ingest missing sessions
        id: ingest
        run: python -m jobs.ingest_session --through "${{ steps.bd.outputs.date }}"

      - name: Commit new sessions
        if: steps.ingest.outputs.new_sessions != '0' && steps.ingest.outputs.new_sessions != ''
        run: |
          git config user.name  'algotrade-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sessions
          if git diff --staged --quiet; then
            echo "nothing staged"
          else
            git commit -m "data: sessions through ${{ steps.bd.outputs.date }} [skip ci]"
            git push
          fi

      # ---- 2. signals: only sessions with data but no stored ranking -------
      - name: Generate signals
        id: signals
        run: |
          python -m jobs.generate_signals \
            --rebuild-panel --backfill "${{ inputs.backfill || '5' }}"

      # ---- 3. value + snapshot: upsert by (portfolio, date) ----------------
      # --rebuild-holdings re-derives the book from executions every day, so a
      # drifted cache is repaired rather than compounding.
      #
      # --all-active rather than just DEFAULT_PORTFOLIO_ID: a shadow portfolio
      # that is never valued has no NAV, and a control group with no NAV
      # measures nothing. The panel is loaded once and shared, so the second
      # book costs seconds rather than repeating the slow step.
      - name: Value portfolios and snapshot
        id: valuation
        run: |
          python -m jobs.value_portfolio --all-active \
            --rebuild-holdings --backfill "${{ inputs.backfill || '5' }}"

      # ---- 4. report (also re-runs reconciliation) -------------------------
      # Runs even if valuation failed, so a reconciliation failure still
      # reaches you rather than being swallowed by an earlier error.
      - name: Send daily report
        if: always() && inputs.skip_report != true
        run: python -m jobs.daily_report

      - name: Acceptance status
        if: always()
        continue-on-error: true
        run: python -m algotrade.acceptance.status

      # ---- 5. heartbeat -----------------------------------------------------
      - name: Heartbeat success
        if: success() && env.HEALTHCHECKS_PING_URL != ''
        continue-on-error: true
        run: |
          curl -fsS -m 10 --retry 3 --data-raw \
            "sessions=${{ steps.ingest.outputs.new_sessions }} signals=${{ steps.signals.outputs.signals_written }} snapshots=${{ steps.valuation.outputs.snapshots_written }}" \
            "$HEALTHCHECKS_PING_URL" || true

      # Explicit failure turns a 26-hour detection delay into an immediate one.
      - name: Heartbeat failure
        if: failure() && env.HEALTHCHECKS_PING_URL != ''
        continue-on-error: true
        run: |
          curl -fsS -m 10 --retry 3 --data-raw \
            "daily failed at ${{ steps.bd.outputs.date }}" \
            "${HEALTHCHECKS_PING_URL%/}/fail" || true

      - name: Alert on failure
        if: failure() && inputs.skip_report != true
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          from algotrade.platform.telegram import TelegramClient, escape
          from algotrade.services.notification import render_ingest_failure
          token, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if token and chat:
              from datetime import date
              TelegramClient(token, chat).send(render_ingest_failure(
                  business_date=date.fromisoformat("${{ steps.bd.outputs.date }}"),
                  stage="daily",
                  detail="see the workflow run for the failing step",
                  run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  self_heals=True,
              ))
          PY
