[pytest]
# The repository contains TWO directories named `tests`: this one and
# `dashboard/tests`. Collecting from the root reached both, and `tests.unit`
# then resolved against whichever landed on sys.path first -- so seven modules
# that import `tests.unit.fakes` failed with `No module named 'tests.unit'`.
#
# The effect was that `pytest tests/unit` worked while the plain `pytest` that
# README documented did not. Scoping collection fixes it and matches how the
# two suites are actually run: the dashboard has its own, invoked from its own
# directory with its own conftest.
testpaths = tests
norecursedirs = dashboard .venv data .git node_modules
