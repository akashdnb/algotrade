timeframes:
  daily:
    base_max_candles: 3
    base_range_atr_multiplier: 0.75
    minimum_displacement_atr: 1.5
    atr_period: 14
    volume_enabled: true
    minimum_volume_ratio: 1.0
    structure_confirmation_required: false
    invalidation_mode: close
    invalidation_buffer_atr: 0.0
    approaching_threshold_pct: 5.0
    near_threshold_pct: 2.0
    displacement_weight: 30
    base_quality_weight: 20
    volume_weight: 15
    structure_weight: 15
    freshness_weight: 20
    min_price: 5.0
    min_sessions_history: 400
  weekly:
    base_max_candles: 3
    base_range_atr_multiplier: 0.75
    minimum_displacement_atr: 1.5
    atr_period: 14
    volume_enabled: true
    minimum_volume_ratio: 1.0
    structure_confirmation_required: false
    invalidation_mode: close
    invalidation_buffer_atr: 0.0
    approaching_threshold_pct: 5.0
    near_threshold_pct: 2.0
    displacement_weight: 30
    base_quality_weight: 20
    volume_weight: 15
    structure_weight: 15
    freshness_weight: 20
    min_price: 5.0
    min_sessions_history: 400
  monthly:
    # Monthly candles are much sparser than daily candles. Use a shorter
    # volatility lookback and slightly wider base/displacement tolerances so
    # the monthly detector is not starved by the ~20 monthly bars available
    # from the 400-session universe eligibility gate.
    base_max_candles: 2
    base_range_atr_multiplier: 1.25
    minimum_displacement_atr: 1.25
    atr_period: 6
    volume_enabled: true
    minimum_volume_ratio: 1.0
    structure_confirmation_required: false
    invalidation_mode: close
    invalidation_buffer_atr: 0.0
    approaching_threshold_pct: 5.0
    near_threshold_pct: 2.0
    displacement_weight: 30
    base_quality_weight: 20
    volume_weight: 15
    structure_weight: 15
    freshness_weight: 20
    min_price: 5.0
    min_sessions_history: 400
