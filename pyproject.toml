# Vercel deployment configuration for the dashboard.
#
# This file exists for the deploy, not for packaging the trading system: there
# is no build backend and nothing installs this project. It declares two things
# Vercel needs and cannot infer here.
#
# 1. WHERE THE APP IS. Vercel auto-detects a FastAPI `app` at conventional
#    locations (app.py, main.py, index.py at the root or under src/ or app/).
#    Ours is at api/index.py so that local development and the deploy share one
#    entrypoint, which needs pointing at explicitly.
#
# 2. WHICH DEPENDENCIES. The root requirements.txt is the TRADING system's --
#    polars, pandas, duckdb, pyarrow, nsefin -- none of which the dashboard
#    imports and which together threaten the 500 MB function bundle limit.
#    Declaring the four real dependencies here keeps that file out of the
#    deploy's reach entirely.

[project]
name = "algotrade-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # AES-GCM for the broker session token. The dashboard reaches
  # `algotrade.brokers.tokens` on every /broker render, so this is an
  # import-time dependency of the deploy rather than an optional extra --
  # without it the function fails to start, it does not degrade.
  "cryptography==50.0.1",
  "fastapi==0.121.2",
  "jinja2==3.1.6",
  "pymongo==4.17.0",
  "python-multipart==0.0.20",
  # The broker client speaks HTTP; the cost card and strategy spec are YAML.
  # Both are small. polars, pandas, duckdb and pyarrow stay out -- that is the
  # limit this list exists to hold, and
  # dashboard/tests/test_import_weight.py enforces it against this file.
  "PyYAML==6.0.3",
  "requests==2.34.2",
]

[tool.vercel]
entrypoint = "api.index:app"
